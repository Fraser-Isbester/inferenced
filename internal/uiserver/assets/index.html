<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>inferenced</title>
<style>
  :root { color-scheme: light dark; --fg:#e6e6e6; --muted:#8a8f98; --bg:#0f1115; --card:#171a21; --line:#242833; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:16px; letter-spacing:.02em; }
  header .sub { color:var(--muted); font-size:12px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:22px; font-weight:600; margin-top:4px; }
  section { margin-top:24px; }
  section h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; }
  .controls { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .status-ok { color:#4ade80; } .status-bad { color:#f87171; }
  .live { height:8px; width:8px; border-radius:50%; background:var(--accent); display:inline-block; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>inferenced</h1>
  <span class="sub">local AI usage dashboard <span class="live" title="live"></span></span>
</header>
<main>
  <div class="controls">
    <label class="muted" for="period">Period</label>
    <select id="period">
      <option value="day">Today</option>
      <option value="month">This month</option>
      <option value="rolling">Rolling 7d</option>
    </select>
  </div>

  <div class="cards">
    <div class="card"><div class="k">Total spend</div><div class="v" id="total-usd">$0.00</div></div>
    <div class="card"><div class="k">Requests</div><div class="v" id="total-reqs">0</div></div>
  </div>

  <section>
    <h2>By model</h2>
    <table><thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Cost</th></tr></thead>
    <tbody id="by-model"></tbody></table>
  </section>

  <section>
    <h2>By team</h2>
    <table><thead><tr><th>Team</th><th class="num">Requests</th><th class="num">Cost</th></tr></thead>
    <tbody id="by-team"></tbody></table>
  </section>

  <section>
    <h2>Live requests</h2>
    <table><thead><tr><th>Time</th><th>Provider</th><th>Model</th><th>Dev</th><th class="num">In</th><th class="num">Out</th><th class="num">Status</th><th class="num">Cost</th></tr></thead>
    <tbody id="live"></tbody></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => "$" + Number(n || 0).toFixed(4);
const timefmt = (ms) => new Date(ms).toLocaleTimeString();

async function loadSpend() {
  const period = $("period").value;
  const res = await fetch(`/api/spend?period=${period}`);
  if (!res.ok) return;
  const r = await res.json();
  $("total-usd").textContent = usd(r.TotalUSD);
  $("total-reqs").textContent = r.TotalRequests || 0;
  fillRows($("by-model"), r.ByModel);
  fillRows($("by-team"), r.ByTeam);
}

function fillRows(tbody, rows) {
  tbody.innerHTML = "";
  (rows || []).forEach((row) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(row.Key) || "—"}</td><td class="num">${row.Requests}</td><td class="num">${usd(row.CostUSD)}</td>`;
    tbody.appendChild(tr);
  });
}

function esc(s) { return String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function addLive(e) {
  const tb = $("live");
  const tr = document.createElement("tr");
  const cls = e.status >= 200 && e.status < 300 ? "status-ok" : "status-bad";
  tr.innerHTML = `<td>${timefmt(e.ts_unix_ms)}</td><td>${esc(e.provider)}</td><td>${esc(e.model)}</td>`
    + `<td class="muted">${esc(e.developer_id)}</td><td class="num">${e.input_tokens}</td>`
    + `<td class="num">${e.output_tokens}</td><td class="num ${cls}">${e.status}</td><td class="num">${usd(e.cost_usd)}</td>`;
  tb.prepend(tr);
  while (tb.children.length > 100) tb.removeChild(tb.lastChild);
}

$("period").addEventListener("change", loadSpend);
loadSpend();
setInterval(loadSpend, 5000);

const es = new EventSource("/api/stream");
es.onmessage = (ev) => { try { addLive(JSON.parse(ev.data)); } catch (_) {} };
</script>
</body>
</html>
