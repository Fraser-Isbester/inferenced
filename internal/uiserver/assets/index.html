<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>inferenced</title>
<style>
  :root {
    color-scheme: dark;
    --fg:#e6e6e6; --muted:#8a8f98; --bg:#0b0d11; --card:#14171e; --card2:#171a21;
    --line:#242833; --accent:#6ea8fe;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f472b6;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:16px; letter-spacing:.02em; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  header .stat { color:var(--muted); font-size:12px; }
  header .stat b { color:var(--fg); font-variant-numeric:tabular-nums; }
  main { padding:24px; max-width:1040px; margin:0 auto; }
  section { margin:0 0 26px; }
  section h2 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 6px; }

  /* Subject rows (the overview) */
  .subj { padding:14px 16px; border-radius:10px; cursor:pointer; transition:background .12s; }
  .subj:hover { background:var(--card2); }
  .subj + .subj { border-top:1px solid var(--line); }
  .subj-head { display:flex; align-items:baseline; gap:10px; margin-bottom:9px; }
  .subj-name { font-size:14px; }
  .subj-name b { font-weight:600; }
  .subj-name .client { color:var(--muted); }
  .subj-head .spacer { flex:1; }
  .amount { font-variant-numeric:tabular-nums; color:var(--muted); }
  .amount b { color:var(--fg); }
  .pill { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }
  .pill.none { color:var(--muted); }

  .gauge { position:relative; height:9px; background:#0a0c10; border:1px solid var(--line); border-radius:6px; overflow:visible; }
  .gauge-fill { height:100%; border-radius:6px; transition:width .35s ease; }
  .gauge .tick { position:absolute; top:-3px; width:2px; height:15px; background:var(--muted); opacity:.6; border-radius:1px; }

  /* Inline rule editor */
  .editor { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none; grid-template-columns:repeat(4,1fr) auto auto; gap:8px; align-items:end; }
  .subj.open .editor { display:grid; }
  .editor label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
  input.cell, select.cell { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; width:100%; font:inherit; }
  button { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .editmsg { grid-column:1/-1; font-size:12px; color:var(--muted); }
  .editmsg.bad { color:var(--bad); }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .kind { text-transform:capitalize; }
  .live-dot { height:7px; width:7px; border-radius:50%; background:var(--accent); display:inline-block; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  select.period { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 7px; font:inherit; }
  tbody tr.clickable { cursor:pointer; } tbody tr.clickable:hover td { background:var(--card2); }
  pre.meta { margin:0; padding:10px 12px; background:#0a0c10; border-radius:6px; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--muted); max-height:280px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .status-ok { color:var(--ok); } .status-bad { color:var(--bad); }
  .empty { color:var(--muted); padding:14px 16px; }
  .reqdetail { padding:6px 2px; font-size:13px; color:var(--muted); }
  .reqdetail .k { text-transform:uppercase; font-size:11px; letter-spacing:.05em; }
  .reqdetail .cost { color:var(--fg); font-variant-numeric:tabular-nums; }
  .reqdetail .cmd { margin-top:6px; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--fg); background:#0a0c10; padding:6px 9px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>inferenced</h1>
  <span class="sub">local admin <span class="live-dot" title="live"></span></span>
  <span class="spacer"></span>
  <span class="stat" id="totals"></span>
  <span class="stat" id="enf" style="margin-left:16px"></span>
</header>
<main>
  <section>
    <h2>Users &amp; teams <span class="muted" style="text-transform:none;letter-spacing:0">— click a row to set a rule</span></h2>
    <div class="panel" id="subjects"><div class="empty">no activity yet</div></div>
  </section>

  <section>
    <h2>AI-produced artifacts <span class="muted" style="text-transform:none;letter-spacing:0">— PRs, commits &amp; more, last 30 days</span></h2>
    <table><thead><tr><th>Type</th><th>Ref</th><th>Source</th><th>Dev</th><th>When</th></tr></thead>
    <tbody id="artifacts"></tbody></table>
  </section>

  <section>
    <h2>Spend by model
      <select id="period" class="period">
        <option value="day">Today</option>
        <option value="month">This month</option>
        <option value="rolling">Rolling 7d</option>
      </select>
    </h2>
    <table><thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Cost</th></tr></thead>
    <tbody id="by-model"></tbody></table>
  </section>

  <section>
    <h2>Live requests <span class="muted" style="text-transform:none;letter-spacing:0">— click a row for metadata</span></h2>
    <table><thead><tr><th>Time</th><th>Provider</th><th>Model</th><th>Client</th><th class="num">In</th><th class="num">Out</th><th class="num">Status</th><th class="num">Cost</th></tr></thead>
    <tbody id="live"></tbody></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => "$" + Number(n || 0).toFixed(2);
const usd4 = (n) => "$" + Number(n || 0).toFixed(4);
const clamp = (n) => Math.max(0, Math.min(100, n));
const timefmt = (ms) => new Date(ms).toLocaleTimeString();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// ---------- Overview: users & teams with gauges + inline rule editor ----------
const statusStyle = {
  ok:          { cls: "ok",   text: (s) => (s.limit_usd ? s.pct + "%" : "") },
  alerting:    { cls: "warn", text: (s) => s.pct + "% · alerting" },
  downgrading: { cls: "warn", text: () => "downgrade active" },
  enforced:    { cls: "bad",  text: () => "ENFORCED" },
  none:        { cls: "none", text: () => "no limit" },
};
const barColor = { ok: "var(--ok)", alerting: "var(--warn)", downgrading: "var(--warn)", enforced: "var(--bad)", none: "var(--accent)" };
let maxSpent = 0;

async function loadOverview() {
  let ov = null, failed = false;
  try { const r = await fetch("/api/overview"); if (r.ok) { ov = await r.json(); } else { failed = true; } }
  catch (_) { failed = true; }
  if (failed) {
    $("subjects").innerHTML = `<div class="empty">⚠ couldn't load overview — the gateway returned an error. Restart <code>inferenced ui</code> on the current build and check its log.</div>`;
    return;
  }
  ov = ov || { subjects: [], enforcement: {}, totals: {} };

  const mode = ov.enforcement && ov.enforcement.enabled ? `enforcing (${esc(ov.enforcement.action)})` : "not enforcing";
  $("enf").innerHTML = `enforcement: <b>${mode}</b>` + (ov.downgrades && ov.downgrades.length ? ` · downgrade: <b>${esc(ov.downgrades.join(", "))}</b>` : "");
  const t = ov.totals || {};
  $("totals").innerHTML = `today <b>${usd4(t.today_usd)}</b> · ${t.today_requests || 0} req &nbsp;·&nbsp; ${t.window_days || 30}d <b>${usd4(t.window_usd)}</b> · ${t.window_requests || 0} req`;

  const box = $("subjects");
  if (!ov.subjects || !ov.subjects.length) { box.innerHTML = `<div class="empty">no activity yet</div>`; return; }
  maxSpent = Math.max(0, ...ov.subjects.map((s) => s.spent_usd || 0));
  box.innerHTML = "";
  ov.subjects.forEach((s) => box.appendChild(subjectRow(s)));
}

function subjectRow(s) {
  const st = statusStyle[s.status] || statusStyle.none;
  const name = s.kind === "team" ? "team " + s.id : s.id;
  const sub = s.kind === "team" ? "agents" : (s.client || "—");
  const pillText = st.text(s);

  let width, color, ticks = "", amountHTML;
  if (s.limit_usd) {
    width = clamp(s.spent_usd / (s.block_threshold_usd || s.limit_usd) * 100);
    color = barColor[s.status];
    amountHTML = `<b>${usd4(s.spent_usd)}</b> <span class="muted">/ ${usd(s.limit_usd)}</span>`;
    if (s.downgrade_threshold_usd && s.block_threshold_usd) {
      ticks = `<span class="tick" style="left:${clamp(s.downgrade_threshold_usd / s.block_threshold_usd * 100)}%"></span>`;
    }
  } else {
    // No limit: show a comparative usage bar (share of the top spender).
    width = maxSpent > 0 ? clamp(s.spent_usd / maxSpent * 100) : 0;
    color = "var(--accent)";
    amountHTML = `<b>${usd4(s.spent_usd)}</b>`;
  }

  const el = document.createElement("div");
  el.className = "subj";
  el.innerHTML =
    `<div class="subj-head">
       <div class="subj-name"><b>${esc(name)}</b> · <span class="client">${esc(sub)}</span></div>
       <span class="spacer"></span>
       <span class="amount">${amountHTML}</span>
       ${pillText ? `<span class="pill ${st.cls}">${esc(pillText)}</span>` : ""}
     </div>
     <div class="gauge"><div class="gauge-fill" style="width:${width}%;background:${color}"></div>${ticks}</div>`;
  el.appendChild(editor(s));
  el.querySelector(".subj-head").addEventListener("click", () => el.classList.toggle("open"));
  return el;
}

function editor(s) {
  const scope = s.kind === "team" ? "team" : "developer";
  const wrap = document.createElement("div");
  wrap.className = "editor";
  const period = s.period || "day";
  wrap.innerHTML =
    `<div><label>Period</label><select class="cell" data-k="period">
        ${["day","month","rolling"].map(p=>`<option ${p===period?"selected":""}>${p}</option>`).join("")}
     </select></div>
     <div><label>Limit $</label><input class="cell" data-k="limit_usd" value="${s.limit_usd||""}" placeholder="50"></div>
     <div><label>Downgrade @ (frac)</label><input class="cell" data-k="downgrade_at" value="${fracOf(s.downgrade_threshold_usd,s.limit_usd)}" placeholder="0.8"></div>
     <div><label>Block @ (frac)</label><input class="cell" data-k="block_at" value="${fracOf(s.block_threshold_usd,s.limit_usd)}" placeholder="1.0"></div>
     <button class="save">Save rule</button>
     <button class="danger del">Remove</button>
     <div class="editmsg"></div>`;
  const get = (k) => wrap.querySelector(`[data-k="${k}"]`).value.trim();
  const msg = wrap.querySelector(".editmsg");
  wrap.querySelector(".save").addEventListener("click", async (e) => {
    e.stopPropagation();
    const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
    const body = { scope, id: s.id, period: get("period"), limit_usd: num(get("limit_usd")), downgrade_at: num(get("downgrade_at")), block_at: num(get("block_at")) };
    msg.className = "editmsg"; msg.textContent = "saving…";
    const r = await fetch("/api/limit", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 204) { loadOverview(); } else { msg.className = "editmsg bad"; msg.textContent = await r.text(); }
  });
  wrap.querySelector(".del").addEventListener("click", async (e) => {
    e.stopPropagation();
    const p = new URLSearchParams({ scope, id: s.id, period: s.period || "day" });
    const r = await fetch("/api/limit?" + p.toString(), { method: "DELETE" });
    if (r.status === 204) loadOverview();
  });
  return wrap;
}

function fracOf(threshold, limit) { return threshold && limit ? +(threshold / limit).toFixed(4) : ""; }

// ---------- Artifacts ----------
async function loadArtifacts() {
  const tb = $("artifacts");
  let rows = [];
  try { const r = await fetch("/api/artifacts?period=rolling&window=720h"); if (r.ok) rows = await r.json(); } catch (_) {}
  tb.innerHTML = rows && rows.length ? "" : `<tr><td colspan="5" class="muted">none yet</td></tr>`;
  (rows || []).forEach((a) => {
    const label = esc(a.ref || a.url || "");
    const ref = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${label}</a>` : label;
    const tr = document.createElement("tr");
    tr.className = "clickable";
    tr.innerHTML = `<td class="kind">${esc((a.kind||"").replace(/_/g," "))}</td><td>${ref} <span class="muted">${esc(a.title||"")}</span></td>`
      + `<td>${esc(a.source)}</td><td class="muted">${esc(a.developer_id||"")}</td><td>${a.first_seen_ms?new Date(a.first_seen_ms).toLocaleString():""}</td>`;
    tr.addEventListener("click", () => toggleArtifactReq(tr, a));
    tb.appendChild(tr);
  });
}

// toggleArtifactReq expands an artifact row to show the request that produced
// it — the tie from a business outcome back to its model, cost, and command.
async function toggleArtifactReq(tr, a) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); return; }
  let html = `<span class="muted">no associated request found</span>`;
  try {
    const r = await fetch(`/api/request?id=${encodeURIComponent(a.request_id||"")}&ts=${a.first_seen_ms||0}`);
    if (r.ok) {
      const d = await r.json();
      let cmds = [];
      try { cmds = (JSON.parse(d.metadata || "{}").commands) || []; } catch (_) {}
      const producing = cmds.find((c) => /\b(pr|mr|issue|release)\s+create|git\s+(commit|push|checkout|switch|branch)/.test(c));
      html = `<div class="reqdetail">`
        + `<span class="k">produced by</span> <b>${esc(d.model)}</b> · ${esc(d.client||d.developer_id)} `
        + `· <span class="cost">${usd4(d.cost_usd)}</span> · ${new Date(d.ts_unix_ms).toLocaleString()}`
        + (producing ? `<div class="cmd">$ ${esc(producing)}</div>` : "")
        + `</div>`;
    }
  } catch (_) {}
  const dr = document.createElement("tr");
  dr.className = "detail";
  dr.innerHTML = `<td colspan="5">${html}</td>`;
  tr.after(dr);
}

// ---------- Spend by model ----------
async function loadSpend() {
  const r = await fetch(`/api/spend?period=${$("period").value}`);
  if (!r.ok) return;
  const rep = await r.json();
  const tb = $("by-model"); tb.innerHTML = "";
  (rep.ByModel || []).forEach((row) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(row.Key)||"—"}</td><td class="num">${row.Requests}</td><td class="num">${usd4(row.CostUSD)}</td>`;
    tb.appendChild(tr);
  });
}

// ---------- Live feed ----------
function addLive(e) {
  const tb = $("live");
  const tr = document.createElement("tr");
  tr.className = "clickable";
  const cls = e.status >= 200 && e.status < 300 ? "status-ok" : "status-bad";
  tr.innerHTML = `<td>${timefmt(e.ts_unix_ms)}</td><td>${esc(e.provider)}</td><td>${esc(e.model)}</td>`
    + `<td class="muted">${esc(e.client || e.developer_id)}</td><td class="num">${e.input_tokens}</td>`
    + `<td class="num">${e.output_tokens}</td><td class="num ${cls}">${e.status}</td><td class="num">${usd4(e.cost_usd)}</td>`;
  tr.addEventListener("click", () => toggleDetail(tr, e.row_id));
  tb.prepend(tr);
  while (tb.children.length > 100) tb.removeChild(tb.lastChild);
}

async function toggleDetail(tr, rowId) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); return; }
  let meta = null;
  try { const r = await fetch(`/api/event?row_id=${rowId}`); if (r.ok) meta = (await r.json()).metadata; } catch (_) {}
  const dr = document.createElement("tr");
  dr.className = "detail";
  dr.innerHTML = `<td colspan="8"><pre class="meta">${esc(meta ? JSON.stringify(meta, null, 2) : "(no metadata captured)")}</pre></td>`;
  tr.after(dr);
}

$("period").addEventListener("change", loadSpend);
loadOverview(); loadArtifacts(); loadSpend();
setInterval(loadOverview, 5000);
setInterval(loadArtifacts, 15000);
setInterval(loadSpend, 8000);

// The live feed holds an open SSE connection; skip it with ?nostream (used by
// headless screenshot tooling that waits for network idle).
if (!location.search.includes("nostream")) {
  const es = new EventSource("/api/stream");
  es.onmessage = (ev) => { try { addLive(JSON.parse(ev.data)); } catch (_) {} };
}
</script>
</body>
</html>
