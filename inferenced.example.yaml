# Example inferenced configuration.
#
# All fields are optional. With no config file present, inferenced listens on
# 127.0.0.1:8766 with every built-in provider enabled. Point the gateway at a
# file with `inferenced --config inferenced.yaml`, or drop it at
# ./inferenced.yaml or $XDG_CONFIG_HOME/inferenced/config.yaml.

listen: "127.0.0.1:8766"

# Identity attribution. `id` overrides the anonymized credential hash (useful
# when the binary is deployed per-user, e.g. via JAMF); `team` is attached to
# every telemetry event.
developer:
  id: ""      # e.g. "alice@example.com"
  team: ""    # e.g. "platform"

providers:
  # Built-ins are enabled by default; set enabled: false to turn one off.
  anthropic: { enabled: true }
  openai: { enabled: true }
  gemini: { enabled: true }
  ollama:
    enabled: true
    upstream: "localhost:11434"   # local Ollama address (plain HTTP)

  # Any endpoint speaking the OpenAI wire format becomes a metered provider with
  # no code changes. Detected by host (Host-first) or by an OpenAI-style path.
  openai_compatible:
    - name: openrouter
      host: openrouter.ai
      base_path: /api/v1
    - name: groq
      host: api.groq.com
    - name: together
      host: api.together.xyz
    # A local server (vLLM, LM Studio) over plain HTTP, priced at zero:
    - name: vllm-local
      host: "localhost:8000"
      scheme: http
      pricing:
        default: { input_per_1m: 0, output_per_1m: 0 }
    # Per-model pricing overrides (substring match; `default` is the fallback):
    - name: fireworks
      host: api.fireworks.ai
      pricing:
        default: { input_per_1m: 0.20, output_per_1m: 0.20 }
        llama-3.1-70b: { input_per_1m: 0.90, output_per_1m: 0.90 }

# Model pricing. Cost is resolved in layers, highest priority first:
#   1. a custom price sheet (`pricing.sheet`), when set,
#   2. live prices fetched on boot from models.dev (cached to disk),
#   3. inferenced's embedded family defaults,
#   4. each provider's built-in price.
# There is no first-party per-provider pricing API, so "live" prices come from
# the community-maintained models.dev aggregate. Setting a custom sheet is
# treated as authoritative and skips the live fetch (embedded defaults still
# backfill any model the sheet omits).
pricing:
  # Path to a custom price sheet (YAML or JSON). Same schema as a provider's
  # `pricing` block: provider -> (model substring | "default") -> per-1M price.
  # sheet: "/etc/inferenced/prices.yaml"
  remote:
    enabled: true                     # default true; false = embedded defaults only
    # url: "https://models.dev/api.json"
    ttl: "24h"                        # cache freshness window (any Go duration)
    # cache_path: ""                  # empty -> $XDG_CACHE_HOME/inferenced/pricing.json

# OpenTelemetry export. When enabled, every metered request is emitted as an
# OTLP/HTTP span using the GenAI semantic conventions (gen_ai.request.model,
# gen_ai.usage.input_tokens/output_tokens) plus cost_usd/developer/team, so the
# data flows into any OTel stack (Grafana/Tempo, Honeycomb, Datadog). This is
# our OWN authoritative telemetry — we never ingest the agent's OTel. When the
# client propagated a `traceparent`, our span is parented to it for correlation.
otel:
  enabled: false                       # default off
  endpoint: "localhost:4318"           # OTLP/HTTP collector (host:port or full URL)
  # insecure: true                     # default true (local plain-HTTP collector); set false to require TLS
  # headers:                           # extra export headers, e.g. a vendor API key
  #   x-honeycomb-team: "YOUR_KEY"

# Local spend ledger. Every metered request is persisted to a pure-Go SQLite
# database (no CGO), which powers the enforcement engine below.
storage:
  enabled: true    # default true; set false to disable persistence entirely
  # path: ""       # empty -> $XDG_DATA_HOME/inferenced/inferenced.db
                   # (or ~/.local/share/inferenced/inferenced.db)

# Enforcement of spend limits against the local ledger. Requires storage; when
# enforcement is on the ledger is started automatically even if disabled above.
enforcement:
  enabled: false   # default false; turn on to evaluate the limits below
  # Enforcement mode. "block" applies each limit's block/downgrade thresholds;
  # "warn" is a dry run that only logs the intended action and forwards unchanged.
  action: block
  # HTTP status used when blocking. Default 402 (Payment Required): coding agents
  # read it as a quota/billing stop and surface the message. Avoid 401/403 (Claude
  # Code maps those to "run /login") and 429 (treated as retryable rate-limiting).
  block_status: 402
  # Model down-scoping map. When a limit crosses its downgrade_at threshold, the
  # request's model is rewritten to the target of the first rule whose `match` is
  # a substring of it (case-insensitive). Works for every provider (body model or,
  # for Gemini, the URL path).
  downgrade:
    - { match: opus,   to: claude-sonnet-4-5 }
    - { match: sonnet, to: claude-haiku-4-5 }
    - { match: gpt-4o, to: gpt-4o-mini }
  limits:
    # Each limit applies when its scope/id matches the request's developer or
    # team. id: "*" matches everyone in that scope.
    #
    # scope:  team | developer
    # period: day | month | rolling  (rolling requires `window`, a Go duration)
    #
    # limit_usd is the reference budget. Thresholds are fractions of it and are
    # fully per-limit, so policy is rule-based and dynamic:
    #   downgrade_at: fraction at/above which the model is down-scoped (omit = never)
    #   block_at:     fraction at/above which the request is blocked (omit = 1.0)
    #
    # team-a: soft-lands onto cheaper models at 80% of budget, hard-stops at 120%.
    - scope: team
      id: team-a
      period: day
      limit_usd: 100
      downgrade_at: 0.8
      block_at: 1.2
    # team-b: never downgraded, simply blocked at 100% of its monthly budget.
    - scope: team
      id: team-b
      period: month
      limit_usd: 500
    # every developer gets their own hard $5/day cap.
    - scope: developer
      id: "*"
      period: day
      limit_usd: 5
    # any team, over a rolling 7-day window.
    - scope: team
      id: "*"
      period: rolling
      window: 168h
      limit_usd: 1000

